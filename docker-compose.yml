name: silatsense-be
x-runtime: &runtime
  build: .
  image: silatsense-be-backend
  env_file: .env
  environment:
    DATABASE_URL: mysql+pymysql://${MYSQL_USER:-silatsense}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-silatsense}
    MEDIA_ROOT: /app/.data/media
  volumes:
    - ./artifacts:/app/artifacts:ro
    - media_data:/app/.data/media
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-silatsense}
      MYSQL_USER: ${MYSQL_USER:-silatsense}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    <<: *runtime
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    <<: *runtime
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m scripts.seed"
  worker:
    <<: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m scripts.worker
    stop_grace_period: 30s
  cleanup:
    <<: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m scripts.cleanup_media
    stop_grace_period: 30s
volumes:
  mysql_data:
  media_data:
